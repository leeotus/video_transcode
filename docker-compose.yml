services:
  mysql8306:
    image: mysql:8.4
    container_name: mysql8306
    restart: unless-stopped
    ports:
      - "8306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "mysqladmin123"
    volumes:
      - mysql84_data:/var/lib/mysql
    networks:
      - video_transcode_net

  minio7000:
    image: minio/minio:latest
    container_name: minio7000
    restart: unless-stopped
    ports:
      - "7000:9000"
      - "7001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin123"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - video_transcode_net
    
  redis8379:
    image: redis:latest
    container_name: redis8379
    restart: unless-stopped
    ports:
      - "8379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - video_transcode_net
    

volumes:
  mysql84_data:
  minio_data:
  redis_data:

networks:
  video_transcode_net:
    driver: bridge